name: Deploy to Nitrado FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:  # manual run from the Actions tab, e.g. to test new FTP secrets

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # needed to detect changed files

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Substitute variables
        run: python scripts/substitute.py

      - name: Validate build
        run: python scripts/validate.py

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}      # bare IP or hostname, no port
          port: ${{ secrets.FTP_PORT }}        # optional; defaults to 21 when the secret is unset
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**

# ============================================================
# Nasdara (dayzxb_missions/dayzOffline.nasdara)
# The complete config for this map. Nothing is shared between
# maps: map size and landscape change what even the global
# multipliers should be, so every value this mission needs
# lives here. Use {{VAR_NAME}} as the placeholder under remote/.
# ============================================================

# --- Infected (env/zombie_territories.xml + db/events.xml) ---

# Final value = dmin/dmax (and event nominal/min/max) * INFECTED_GLOBAL_D_MULTIPLIER * <Type>_D_MULTIPLIER
# Zero values in the XML are always preserved. Raise ZOMBIE_MAX_COUNT (below) with this: the
# budget shares do not follow the multiplier, and a budget-capped base shows no change at all.
INFECTED_GLOBAL_D_MULTIPLIER: 3.0

# Most items an infected can carry. Vanilla is 5 for nearly every type; uncomment to cap it.
#INFECTED_LOOT_MAX: 2

# Per-event spawn parameters, for reference (edit events.xml directly if needed):
#   lifetime 3, restock 0, saferadius 100, distanceradius 50, cleanupradius 100

# Per-type multipliers on top of the global. 1.0 = follow the global.
# Vanilla misspells the religious zones "InfedctedReligious"; those 31 zones match no
# event name and are left exactly as shipped.
InfectedVillage_D_MULTIPLIER: 1.0
InfectedVillageTier1_D_MULTIPLIER: 1.0
InfectedCity_D_MULTIPLIER: 1.0
InfectedSolitude_D_MULTIPLIER: 1.0 # lone infected in the wild, 228 zones
InfectedPolice_D_MULTIPLIER: 1.0
InfectedPoliceHard_D_MULTIPLIER: 1.0
InfectedMedic_D_MULTIPLIER: 1.0
InfectedReligious_D_MULTIPLIER: 1.0
InfectedFirefighter_D_MULTIPLIER: 1.0
InfectedIndustrial_D_MULTIPLIER: 1.0
InfectedArmy_D_MULTIPLIER: 1.0
InfectedArmyION_D_MULTIPLIER: 1.0
InfectedArmyConvoy_D_MULTIPLIER: 1.0
InfectedNBCYellow_D_MULTIPLIER: 1.0
# Placed singles, not a density: 30 lone Mummies at isolated structures (zones and event
# named InfectedMummy). _D_ABSOLUTE replaces the global instead of stacking on it, so each
# spot holds exactly one whatever the global is set to.
InfectedMummy_D_ABSOLUTE: 1.0

# --- Animals (db/events.xml) ---

# Same scheme: final = nominal/min/max * ANIMAL_GLOBAL_D_MULTIPLIER * <Event>_D_MULTIPLIER
ANIMAL_GLOBAL_D_MULTIPLIER: 1.0

# Wolves ship inactive. Wild dog packs are the shipped predator.
AnimalDog_D_MULTIPLIER: 1.5 # 8 packs -> 12. Nasdara's answer to Sakhal's wolves.

# Bears ship inactive AND unwired: the mission carries the AnimalBear event at nominal 0 and a
# bear_territories.xml that is Livonia's file unchanged (85 zones covering only the south-west
# 12.8 km of a 16.4 km map), and cfgenvironment.xml never references either. Our
# remote/cfgenvironment.xml wires the Bear herd, remote/db/events.xml turns the event on at
# Sakhal's vanilla 5, and remote/env/bear_territories.xml is our own zone file: zones on Bohemia's
# Nasdara wolf, mouflon and goat ground across the southern and eastern half, none in the
# north-west quadrant where every fresh spawn is (!aux/make_bear_zones.py rebuilds it).
# This multiplier is the verification setting: 40 bears so the first encounter comes quickly.
# Drop to 1.0 once a bear has been seen; 0 turns them off again (nominal 0, as the mission shipped).
AnimalBear_D_MULTIPLIER: 8.0 # 5 -> 40

# --- Vehicles (db/events.xml) ---

# Same scheme: final = nominal/min/max * VEHICLE_GLOBAL_D_MULTIPLIER * <Event>_D_MULTIPLIER
VEHICLE_GLOBAL_D_MULTIPLIER: 1.0

# No boats here. Motorbikes are the fast travel and vanilla spawns 30 of them.
VehicleMotorbike_D_MULTIPLIER: 0.5 # 30 -> 15

# --- Loot (db/types.xml) --- vanilla

# Scales nominal and min for every item in that types.xml category (rounds up, never to zero).
# Categories: food, tools, weapons, clothes, containers, explosives, lootdispatch. 1.0 = vanilla.
LOOT_FOOD_MULTIPLIER: 1.0
LOOT_TOOLS_MULTIPLIER: 1.0

# Scales min ONLY, for every spawning type, after the category multiplier above.
# Below 1.0 widens the gap between min and nominal so the map empties further
# before the CE restocks anything. Rounds DOWN, never below 1: at 0.8, min 3 -> 2, min 20 -> 16.
LOOT_MIN_MULTIPLIER: 1.0

# Minimum restock delay in seconds. Vanilla is 0 for most items, so a type
# refills as soon as it drops under min. 3600 would slow the map-wide top-up to an hour.
LOOT_RESTOCK_MIN: 0

# --- Economy Globals (db/globals.xml) ---

ANIMAL_MAX_COUNT: "500" # Default: 200 - cap on living animals map-wide
CLEANUP_DEAD_INFECTED: "600" # Default: 330 - seconds a dead infected stays
CLEANUP_DEAD_PLAYER: "7200" # Default: 3600 - seconds your body (and gear) stays for a recovery run
LOOT_DAMAGE_MAX: "0.70" # Default: 0.82 - most damage loot can spawn with (0 = pristine)
TIME_LOGIN: "3" # Default: 15 - login timer, seconds
TIME_LOGOUT: "3" # Default: 15 - logout timer, seconds
TIME_PENALTY: "10" # Default: 20 - extra wait after a combat or forced disconnect
# Cap on infected in the world, split across the infected events in proportion to their zones'
# total dmax; the RPT prints the split at start ("InfectedArmyION :: dmax: 320.0, 4.2 % == 41 pcs"
# at 2x). The shares do not move with the density multipliers. Vanilla's 1000 is sized for a
# full server; solo, a small-footprint event's share is less than one of its bases: ArmyION had
# 41 pieces against bases wanting 48-72, and the 11-25 base log shows kills coming back only as
# whole waves once their corpses cleaned up, 20 minutes later. A cap, not a spawn count: only
# awake zones hold infected, so a large value costs nothing. 7000 keeps every event's share above
# two full clusters at 3x (one being fought, one still cleaning up); !aux/budget_check.py shows the
# per-event numbers for any zone file, cap and wake distance.
ZOMBIE_MAX_COUNT: "7000" # Default: 1000
ZONE_SPAWN_DIST: "400" # Default: 300 - metres from an infected zone at which it wakes and spawns its band

# --- Solo QoL (cfggameplay.json) ---

# Shock regenerates at this rate per second while unconscious. Solo, nobody is
# going to wake you, so 1.0 means minutes of staring at black. 2.0 halves it.
SHOCK_REFILL_UNCONSCIOUS: 3.0 # Default: 1.0

# --- Weather (cfggameplay.json) --- Nasdara only; the sandstorm is scripted into this map alone

# Multiplies the 8 percent chance that a bad-weather spell turns into a sandstorm. Nasdara's weather
# changes every 20-30 minutes and about one change in four turns bad, so vanilla 1.0 is roughly one
# storm per 20-25 hours of server time, and a few hours of play a day rarely meets one. 0 switches
# them off; 12.5 makes every bad spell a storm. cfgweather.xml has no say in this and ships disabled.
SANDSTORM_FREQUENCY: 1.0 # Default: 1.0

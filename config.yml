# ============================================================
# DayZ Server Configuration Variables
# These values are substituted into the files under remote/
# before deployment. Use {{VAR_NAME}} as the placeholder.
# ============================================================

# --- Spawn Coordinates (Sakhal) --- map: 15360 x 15360

# cfgplayerspawnpoints.xml is vanilla (117 points). For testing, re-template it:
# replace the <pos> entries with <pos x="{{SPAWN_X}}" z="{{SPAWN_Z}}" /> and the
# <fresh> spawn_params min/max distances with {{MIN_DIST}}/{{MAX_DIST}}, then
# uncomment these. Reference spots:
#   Northeast Pier:     13915, 12525
#   Petropavlovsk Pier:  5415, 10880
#SPAWN_X: "13915"
#SPAWN_Z: "12525"
#MIN_DIST: "0"
#MAX_DIST: "400"

# --- Infected Spawn Parameters (Sakhal) (Defaults varied so most common is listed below) ---

#INFECTED_LIFETIME: "3" # Default: 3
#INFECTED_RESTOCK: "0" # Default: 0
#INFECTED_SAFE_RADIUS: "100" # Default: 100
#INFECTED_DISTANCE_RADIUS: "300" # Default: 50
#INFECTED_CLEANUP_RADIUS: "300" # Default: 100

# --- Zombie Territories ---

# Per-type D multipliers. Final value = dmin/dmax * INFECTED_GLOBAL_D_MULTIPLIER * <Type>_D_MULTIPLIER
# Set to 1.0 for no change relative to global. Zero values in the XML are always preserved.
# INFECTED_ALL_RADIUS: "150"
INFECTED_GLOBAL_D_MULTIPLIER: 2.0

InfectedCityTier1_D_MULTIPLIER: 1.0
InfectedVillage_D_MULTIPLIER: 1.0
InfectedArmy_D_MULTIPLIER: 1.0
InfectedFirefighter_D_MULTIPLIER: 1.0
InfectedScientist_D_MULTIPLIER: 1.0
InfectedIndustrial_D_MULTIPLIER: 1.0
InfectedPrisoner_D_MULTIPLIER: 1.0
InfectedReligious_D_MULTIPLIER: 1.0
InfectedMedic_D_MULTIPLIER: 1.0
InfectedArmyHeavy_D_MULTIPLIER: 1.0
InfectedVillageTier1_D_MULTIPLIER: 1.0
InfectedPoliceHard_D_MULTIPLIER: 1.0
InfectedCity_D_MULTIPLIER: 1.0

# --- Animals (db/events.xml) ---

# Same scheme as infected: final = nominal/min/max * ANIMAL_GLOBAL_D_MULTIPLIER * <Event>_D_MULTIPLIER
# Wolf and bear counts are packs. Pack size lives in events.xml <children>.
ANIMAL_GLOBAL_D_MULTIPLIER: 1.0

AnimalWolf_D_MULTIPLIER: 1.5 # 8 packs -> 12. Wolves are the real solo threat on Sakhal.
AnimalBear_D_MULTIPLIER: 1.0 # Default: 5

# --- Vehicles (db/events.xml) ---

# Same scheme. Fewer boats makes Sakhal a big map again.
VEHICLE_GLOBAL_D_MULTIPLIER: 1.0

VehicleBoat_D_MULTIPLIER: 0.5 # Default: 14 civilian boats -> 7
VehicleMilitaryBoat_D_MULTIPLIER: 0.5 # Default: 8 military boats -> 4

# --- Loot (db/types.xml) ---

# Scales nominal and min for every item in that types.xml category (rounds up, never to zero).
# Categories on Sakhal: food, tools, weapons, clothes, containers, explosives, lootdispatch.
LOOT_FOOD_MULTIPLIER: 0.5
LOOT_TOOLS_MULTIPLIER: 0.7

# Scales min ONLY, for every spawning type, after the category multiplier above.
# A wider gap between min and nominal lets the map empty further before the CE
# restocks anything, so a looted town stays looted and you travel.
# Rounds DOWN, never below 1, so small thresholds actually move: min 3 -> 2, min 20 -> 17.
LOOT_MIN_MULTIPLIER: 0.85

# Minimum restock delay in seconds. Vanilla is 0 for most items, so a looted town
# refills as soon as it drops under min. One hour keeps a cleared town cleared.
LOOT_RESTOCK_MIN: 3600

# Most items an infected can carry. Vanilla is 5 for nearly every type.
INFECTED_LOOT_MAX: 2

# --- Economy Globals (db/globals.xml) ---

ANIMAL_MAX_COUNT: "500" # Default: 200 - cap on living animals map-wide
CLEANUP_DEAD_INFECTED: "1200" # Default: 330 - seconds a dead infected stays
CLEANUP_DEAD_PLAYER: "7200" # Default: 3600 - seconds your body (and gear) stays for a recovery run
LOOT_DAMAGE_MAX: "0.70" # Default: 0.82 - most damage loot can spawn with (0 = pristine)
TIME_LOGIN: "3" # Default: 15 - login timer, seconds
TIME_LOGOUT: "3" # Default: 15 - logout timer, seconds
TIME_PENALTY: "10" # Default: 20 - extra wait after a combat or forced disconnect

# --- Solo QoL (cfggameplay.json) ---

# Shock regenerates at this rate per second while unconscious. Solo, nobody is
# going to wake you, so 1.0 means minutes of staring at black. 2.0 halves it.
SHOCK_REFILL_UNCONSCIOUS: 2.0 # Default: 1.0







